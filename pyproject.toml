[project]
name = "mysql-config-coder"
version = "1.0.0"
description = "Encode and decode MySQL .mylogin.cnf files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pycryptodome>=3.23.0"]

[project.scripts]
mysql_config_coder = "mysql_config_coder:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.0",
    "ty>=0.0.1a20",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
